services:
  app:
    build: .
    environment:
      PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: notes
      DB_USER: notes_app
      DB_PASSWORD: change-me-for-production
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - database
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes_app
      POSTGRES_PASSWORD: change-me-for-production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_app -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - database
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
